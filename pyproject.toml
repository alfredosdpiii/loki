[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loki-guardrails"
dynamic = ["version"]
description = "Deterministic guardrails for AI coding agents: blocks unsafe edits before they land"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/anti-slop/LICENSE"]
authors = [{ name = "Bryan" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
  "ai-agents",
  "claude-code",
  "codex",
  "guardrails",
  "hooks",
  "linting",
  "static-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/alfredosdpiii/loki"
Documentation = "https://github.com/alfredosdpiii/loki/blob/main/docs/reference.md"
Issues = "https://github.com/alfredosdpiii/loki/issues"

[project.scripts]
loki = "loki_guardrails.loki:cli"

[tool.hatch.version]
path = "loki.py"

# The wheel keeps the repository layout inside one package, so loki.py finds
# templates/, shim/ and vendor/ next to itself exactly as it does in a checkout.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"packaging/__init__.py" = "loki_guardrails/__init__.py"
"loki.py" = "loki_guardrails/loki.py"
"templates" = "loki_guardrails/templates"
"shim" = "loki_guardrails/shim"
"vendor" = "loki_guardrails/vendor"

[tool.hatch.build.targets.sdist]
include = [
  "loki.py",
  "packaging/__init__.py",
  "templates",
  "shim",
  "vendor",
  "tests",
  "README.md",
  "LICENSE",
]

[dependency-groups]
dev = [
  "coverage==7.15.4",
  "mutmut==3.7.0",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
include = ["loki.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
]


[tool.mutmut]
source_paths = ["loki.py"]
also_copy = ["templates", "shim", "vendor"]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = ["tests"]
mutate_only_covered_lines = true
on_dependency_change = "rerun"
