name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure Git identity for fixture commits
        run: |
          git config --global user.name "Loki CI"
          git config --global user.email "ci@example.invalid"
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked -- --test-threads=4
      - name: Build release and dogfood slop check
        run: |
          cargo build --release --locked
          ./target/release/loki --version
          ./target/release/loki --root . slop
