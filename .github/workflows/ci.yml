name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tools
        run: python -m pip install ruff==0.15.2
      - name: Configure Git identity for fixture commits
        run: |
          git config --global user.name "Loki CI"
          git config --global user.email "ci@example.invalid"
      - name: Lint
        run: |
          ruff check --config templates/.ruff.toml loki.py tests benchmarks
          ruff format --check loki.py tests benchmarks
      - name: Test
        run: python -m unittest discover -s tests -t .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/loki --version
          git init -q /tmp/repo
          /tmp/clean/bin/loki init --dir /tmp/repo
          cmp /tmp/repo/.loki/loki.py loki.py
