name: loki

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  loki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: ${{ hashFiles('**/*.py') != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        if: ${{ hashFiles('**/*.py') != '' }}
        run: python -m pip install ruff

      - name: Set up Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Oxlint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install --no-save --ignore-scripts oxlint @oxlint/plugins

      - name: Set up Go
        if: ${{ hashFiles('**/*.go') != '' }}
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Set up golangci-lint
        if: ${{ hashFiles('**/*.go') != '' }}
        uses: golangci/golangci-lint-action@v9
        with:
          install-only: true

      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Elixir
        if: ${{ hashFiles('mix.exs') != '' }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Install Elixir dependencies
        if: ${{ hashFiles('mix.exs') != '' }}
        run: mix deps.get

      - name: Run loki
        env:
          LOKI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .loki/loki.py scan --strict --base "$LOKI_BASE"
