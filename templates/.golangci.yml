version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - gocritic
    - errorlint
    - nilerr
    - durationcheck
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gosec:
      # Duplicate of errcheck, permission and math/rand checks are too noisy to block.
      excludes: [G104, G301, G302, G306, G404]
