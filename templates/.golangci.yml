version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - gocritic
    - errorlint
    - nilerr
    - durationcheck
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Conventionally ignored: deferred read-side closes and response writes.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*os.Root).Close
        - (*database/sql.Rows).Close
        - (net/http.ResponseWriter).Write
    gocritic:
      enabled-checks:
        - deferInLoop
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gosec:
      # Duplicate of errcheck; permission, variable file path and math/rand
      # checks are too noisy to block.
      excludes: [G104, G301, G302, G304, G306, G404]
