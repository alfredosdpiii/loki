target-version = "py311"

[lint]
select = ["E", "F", "B", "ASYNC", "S", "I", "PLE", "LOG", "RUF006", "RUF100"]
# S603 flags every subprocess call, including shell-free argument lists.
# S602/S604/S605 still catch shell=True and shell-string execution.
ignore = ["S603"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
"test_*.py" = ["S101"]
"*_test.py" = ["S101"]
