target-version = "py311"

[lint]
select = ["E", "F", "B", "ASYNC", "S", "I", "PLE", "LOG", "RUF006", "RUF100", "SIM115"]
# S603/S607 flag every shell-free subprocess call and bare executable name;
# S602/S604/S605 still catch shell=True and shell-string execution.
# E501 is style; the formatter owns line length.
ignore = ["E501", "S603", "S607"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
"test_*.py" = ["S101"]
"*_test.py" = ["S101"]
